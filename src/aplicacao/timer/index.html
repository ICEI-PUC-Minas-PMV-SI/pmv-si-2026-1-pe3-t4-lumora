<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lumora Timer</title>

  <!-- Fonte Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="timer-page">

  <button class="hamburger-btn" id="hamburger-btn" aria-label="Abrir menu" aria-expanded="false" aria-controls="sidebar">
    <i data-lucide="menu"></i>
  </button>
  <div class="sidebar-overlay" id="sidebar-overlay"></div>

  <aside id="sidebar" class="sidebar">
    <div class="sidebar-header">
      <img src="../src/img/logo.png" alt="Logo Lumora" class="logo">
      <h2>Lumora</h2>
    </div>
    <nav class="sidebar-nav">
      <button class="sidebar-btn" type="button" onclick="window.location.href='../to-do-list/index.html'">
        <i data-lucide="notebook-pen"></i>
        <span>início</span>
      </button>
      <button class="sidebar-btn" type="button">
        <i data-lucide="calendar"></i>
        <span>Calendário</span>
      </button>
      <button class="sidebar-btn" type="button">
        <i data-lucide="bar-chart-3"></i>
        <span>Progresso</span>
      </button>
      <button class="sidebar-btn active" type="button" aria-current="page">
        <i data-lucide="clock-plus"></i>
        <span>Modo Foco</span>
      </button>
      <button class="sidebar-btn" type="button" onclick="window.location.href='../perfil/index.html'">
        <i data-lucide="user-round"></i>
        <span>Perfil</span>
      </button>
    </nav>
  </aside>

  <div class="main-content">
  <!-- Botão de tema -->
  <button class="theme-toggle" type="button">🌙</button>

  <main class="timer-app">
    <section class="timer-card" aria-labelledby="timer-title">

      <h1 id="timer-title">Modo Foco</h1>

      <div class="timer-container">

        <!-- Anel de progresso -->
        <svg class="progress-ring" viewBox="0 0 280 280">
          <circle class="progress-background" cx="140" cy="140" r="120"></circle>
          <circle class="progress" cx="140" cy="140" r="120"></circle>
        </svg>

        <!-- Timer com opções de alteração do tempo -->
        <div class="timer">

          <div class="picker-wrapper">
            <span class="time-unit minutes" tabindex="0">25</span>
            <div class="picker minutes-picker"></div>
          </div>

          <span class="separator">:</span>

          <div class="picker-wrapper">
            <span class="time-unit seconds" tabindex="0">00</span>
            <div class="picker seconds-picker"></div>
          </div>

        </div>

      </div>

      <p class="finished-message" aria-live="polite">Tempo finalizado!</p>

      <!-- Botões -->
      <div class="buttons">
        <button class="start">Iniciar</button>
        <button class="pause">Pausar</button>
        <button class="reset">Reiniciar</button>
      </div>

    </section>
  </main>
  </div>

  <script src="js/script.js"></script>

</body>
</html>
