<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lumora - Entrar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">

    <div class="left-panel">
      <div class="brand">
        <img src="../src/img/logo.png" alt="Logo Lumora" class="logo">
        <span class="brand-name">Lumora</span>
      </div>
      <div class="illustration">
        <div class="emoji-illustration">🌿</div>
        <p class="illustration-text">Bem-vindo de volta!<br>Pronto para organizar seu dia?</p>
      </div>
    </div>
    <div class="right-panel">
      <div class="form-wrapper">

        <h1 class="form-title">Organize. Foque. Conquiste</h1>

        <button class="btn-google" id="btn-google">
            <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google" class="google-icon">
            Entrar com Google
        </button>

        <div class="divider">
          <span>entre com e-mail</span>
        </div>

        <div class="form-group">
          <label for="email">E-MAIL</label>
          <input type="email" id="email" placeholder="ex: lumora@email.com" />
        </div>

        <div class="form-group">
          <label for="password">SENHA</label>
          <input type="password" id="password" placeholder="Sua senha" />
        </div>

        <p class="error-msg" id="error-msg"></p>

        <button class="btn-primary" id="btn-login">Entrar</button>

        <div class="form-links">
          <a href="recuperar-senha.html">Esqueci minha senha</a>
          <a href="cadastro.html">Criar nova conta</a>
        </div>

      </div>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
