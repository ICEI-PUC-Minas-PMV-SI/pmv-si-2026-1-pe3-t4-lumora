<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lumora - Entrar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- CONTAINER PRINCIPAL: divide a tela em 2 colunas -->
  <div class="container">

    <!-- COLUNA ESQUERDA: ilustração + texto -->
    <div class="left-panel">
      <div class="brand">
        <img src="../src/img/logo.png" alt="Logo Lumora" class="logo">
        <span class="brand-name">Lumora</span>
      </div>
      <div class="illustration">
        <!-- Emoji como ilustração enquanto não temos imagem -->
        <div class="emoji-illustration">🌿</div>
        <p class="illustration-text">Bem-vindo de volta!<br>Pronto para organizar seu dia?</p>
      </div>
    </div>

    <!-- COLUNA DIREITA: formulário -->
    <div class="right-panel">
      <div class="form-wrapper">

        <h1 class="form-title">Entrar no Lumora</h1>

        <!-- DIVISOR -->
        <div class="divider">
          <span>entre com e-mail</span>
        </div>

        <!-- FORMULÁRIO DE LOGIN -->
        <div class="form-group">
          <label for="email">E-MAIL</label>
          <input type="email" id="email" placeholder="ex: lumora@email.com" />
        </div>

        <div class="form-group">
          <label for="password">SENHA</label>
          <input type="password" id="password" placeholder="Sua senha" />
        </div>

        <!-- MENSAGEM DE ERRO (fica escondida até dar erro) -->
        <p class="error-msg" id="error-msg"></p>

        <!-- BOTÃO PRINCIPAL -->
        <button class="btn-primary" id="btn-login">Entrar</button>

        <!-- LINKS ABAIXO DO BOTÃO -->
        <div class="form-links">
          <a href="#">Esqueci minha senha</a>
          <a href="cadastro.html">Criar nova conta</a>
        </div>

      </div>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
